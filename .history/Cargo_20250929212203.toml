[package]
name = "rust_webgl_example"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "Animation",
    "HtmlCanvasElement",
    "WebGlRenderingContext",
    "WebGlBuffer",
    "WebGlProgram", 
    "WebGlShader",
    "WebGlUniformLocation",
    "MouseEvent",
    "KeyboardEvent",
    "HtmlTextAreaElement",
    "AddEventListenerOptions",
    'CanvasRenderingContext2d',
    "web_sys::HtmlElement
] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
lazy_static = "1.4"

[lib]
crate-type = ["cdylib"]